<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LEGAL PRO. Технические работы.">
  <meta name="color-scheme" content="light">
  <title>LEGAL PRO — Технические работы</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpg">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #fff; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1rem; color: #111; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(100%, 34rem); text-align: center; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; }
    h1 { margin: 0.5rem 0 0; font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <img src="./logo.jpg" width="1254" height="836" alt="LEGAL PRO">
    <h1>Технические работы</h1>
  </main>
</body>
</html>
