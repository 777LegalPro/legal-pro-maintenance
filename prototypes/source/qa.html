<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка адаптации</title><style>body{margin:0;background:#e7ebef;font:14px Arial;color:#152237}header{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px;background:white;border-bottom:1px solid #ccd4df}label{display:flex;gap:8px;align-items:center}select{padding:9px}main{padding:20px;display:flex;justify-content:center}iframe{width:360px;height:780px;border:1px solid #bdc9d8;background:white;box-shadow:0 10px 30px #17233918}</style></head><body><header><strong>Проверка адаптации</strong><label>Страница<select id="page"><option value="administration">Администрация</option><option value="central-court">Районный суд</option><option value="magistrate-2">Участок № 2</option><option value="duma">Дума</option><option value="vdpo">ВДПО</option><option value="">Каталог</option></select></label><label>Ширина<select id="width"><option>360</option><option>390</option><option>768</option><option>1200</option></select></label></header><main><iframe title="Прототип в выбранном размере" src="/prototypes/administration/"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('#page').addEventListener('change',e=>{frame.src='/prototypes/'+(e.target.value?e.target.value+'/':'')});document.querySelector('#width').addEventListener('change',e=>{frame.style.width=e.target.value+'px'});</script></body></html>
